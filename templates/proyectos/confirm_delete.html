{% extends "base.html" %}

{% block title %}Eliminar{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <div class="page-title">Eliminar proyecto</div>
      <div class="muted">Esta acción no se puede deshacer.</div>
    </div>
    <a class="btn btn-secondary" href="{% url 'proyecto_detail' proyecto.pk %}">Volver</a>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="card" style="border: none; padding: 0; margin: 0 0 14px;">
      <div class="card-title">{{ proyecto.titulo }}</div>
      <div class="muted">¿Seguro que deseas eliminar este proyecto?</div>
    </div>

    <div class="actions">
      <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      <a class="btn btn-secondary" href="{% url 'proyecto_detail' proyecto.pk %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
