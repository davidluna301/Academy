<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Academy{% endblock %}</title>
    <style>
      /* Reset mínimo */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root{
        --primary: #1565C0;
        --bg: #f5f5f5;
        --text: #333;
        --border: #d9d9d9;
        --danger: #b71c1c;
      }

      body{
        font-family: -apple-system, Segoe UI, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      a{ color: inherit; text-decoration: none; }
      a:hover{ text-decoration: underline; }

      .container{
        max-width: 800px;
        margin: 0 auto;
        padding: 28px 18px;
      }

      .navbar{
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .navbar-inner{
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .brand{
        font-weight: 700;
        letter-spacing: .2px;
      }
      .nav-links{
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav-links span{
        color: #666;
        font-size: 14px;
      }

      .btn{
        display: inline-block;
        background: var(--primary);
        color: #fff;
        padding: 10px 14px;
        border: 1px solid var(--primary);
        border-radius: 6px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover{ text-decoration: none; opacity: .95; }
      .btn-secondary{
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-danger{
        background: var(--danger);
        border-color: var(--danger);
      }

      .messages{
        margin: 18px 0 0;
        display: grid;
        gap: 10px;
      }
      .message{
        background: #fff;
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-left: 4px solid var(--primary);
      }
      .message.success{ border-left-color: var(--primary); }
      .message.error{ border-left-color: var(--danger); }

      .page-head{
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 18px 0;
      }
      .page-title{
        font-size: 22px;
        font-weight: 800;
        letter-spacing: .2px;
      }

      .card{
        background: #fff;
        border: 1px solid var(--border);
        padding: 16px;
        margin: 12px 0;
      }
      .card-title{
        font-weight: 800;
        margin-bottom: 6px;
      }
      .muted{ color: #666; font-size: 14px; }
      .actions{
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      form{
        background: #fff;
        border: 1px solid var(--border);
        padding: 18px;
      }
      .form-group{ margin-bottom: 14px; }
      label{
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      textarea{
        width: 100%;
        border: none;
        border-bottom: 2px solid var(--border);
        padding: 10px 8px;
        background: transparent;
        outline: none;
        font: inherit;
      }
      textarea{ resize: vertical; min-height: 140px; }
      input:focus, textarea:focus{
        border-bottom-color: var(--primary);
      }
      .help, .errorlist{
        margin-top: 6px;
        color: #666;
        font-size: 13px;
      }
      .errorlist{ color: var(--danger); list-style: none; }

      @media (max-width: 520px){
        .navbar-inner{ flex-direction: column; align-items: flex-start; }
        .page-head{ flex-direction: column; align-items: flex-start; }
        .btn{ width: 100%; text-align: center; }
        .actions .btn{ width: auto; }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="navbar-inner">
        <div class="brand"><a href="{% url 'home' %}">Academy</a></div>
        <div class="nav-links">
          {% if user.is_authenticated %}
            <span>Hola, {{ user.username }}</span>
            <a class="btn btn-secondary" href="{% url 'proyecto_list' %}">Proyectos</a>
            <a class="btn" href="{% url 'proyecto_create' %}">Nuevo</a>
            <a class="btn btn-secondary" href="{% url 'logout' %}">Salir</a>
          {% else %}
            <a class="btn btn-secondary" href="{% url 'login' %}">Login</a>
            <a class="btn" href="{% url 'register' %}">Registro</a>
          {% endif %}
        </div>
      </div>
    </div>

    <div class="container">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
